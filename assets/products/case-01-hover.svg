<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1200" role="img" aria-label="كفر أنيق - زاوية ثانية">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fffdfc"/>
      <stop offset="0.45" stop-color="#f8e7e2"/>
      <stop offset="1" stop-color="#ead1dd"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="38%" r="42%">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.98"/>
      <stop offset="0.45" stop-color="#f7e1e4" stop-opacity="0.58"/>
      <stop offset="1" stop-color="#f1c9d4" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="case" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f9e2da"/>
      <stop offset="0.45" stop-color="#d8a4b2"/>
      <stop offset="1" stop-color="#b97f91"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fae7bb"/>
      <stop offset="0.48" stop-color="#d9b56f"/>
      <stop offset="1" stop-color="#a67842"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="28" stdDeviation="24" flood-color="#8d5f69" flood-opacity="0.2"/>
    </filter>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>

  <rect width="1200" height="1200" fill="url(#bg)"/>
  <circle cx="600" cy="360" r="345" fill="url(#glow)"/>
  <ellipse cx="600" cy="860" rx="260" ry="72" fill="#8f6570" opacity="0.11" filter="url(#soft)"/>
  <ellipse cx="600" cy="585" rx="360" ry="240" fill="#c98c99" opacity="0.07" filter="url(#soft)"/>

  <g filter="url(#shadow)" transform="rotate(-6 600 600)">
    <rect x="438" y="250" width="324" height="610" rx="76" fill="url(#case)"/>
    <rect x="470" y="286" width="260" height="538" rx="54" fill="#fff7f4" opacity="0.94"/>
    <rect x="508" y="318" width="184" height="410" rx="34" fill="none" stroke="url(#gold)" stroke-width="12" opacity="0.8"/>
    <circle cx="598" cy="768" r="18" fill="url(#gold)"/>
    <circle cx="598" cy="386" r="70" fill="#f7dce0"/>
    <circle cx="598" cy="386" r="40" fill="#fff7f4"/>
    <circle cx="552" cy="340" r="10" fill="#fff"/>
    <circle cx="645" cy="340" r="10" fill="#fff"/>
    <circle cx="598" cy="434" r="10" fill="#fff"/>
    <circle cx="745" cy="376" r="10" fill="#fff"/>
  </g>
</svg>
