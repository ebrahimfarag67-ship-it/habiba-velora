    <path d="M380 455 C 460 326, 740 326, 820 455" fill="none" stroke="#f5d9cf" stroke-width="8" stroke-linecap="round" opacity="0.82"/>

    <circle cx="352" cy="430" r="12" fill="url(#rose)"/>
    <circle cx="848" cy="430" r="12" fill="url(#rose)"/>

    <g opacity="0.98">
