      <path d="M0 -92 C 51 -92, 95 -49, 95 6 C 95 90, 46 138, 0 182 C -46 138, -95 90, -95 6 C -95 -49, -51 -92, 0 -92Z" fill="#fff7f5" opacity="0.98"/>
      <path d="M0 -62 C 36 -62, 66 -32, 66 6 C 66 60, 30 92, 0 120 C -30 92, -66 60, -66 6 C -66 -32, -36 -62, 0 -62Z" fill="url(#rose)"/>
