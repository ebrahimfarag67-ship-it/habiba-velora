<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1200" role="img" aria-label="سلسلة فاخرة">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fffdfc"/>
      <stop offset="0.45" stop-color="#f8e7e1"/>
      <stop offset="1" stop-color="#ead2dc"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="36%" r="42%">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.96"/>
      <stop offset="0.42" stop-color="#f7e0e1" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#f2c8cf" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fae7bb"/>
      <stop offset="0.48" stop-color="#d9b56f"/>
      <stop offset="1" stop-color="#a67842"/>
    </linearGradient>
    <linearGradient id="rose" x1="0" y1="0" x2="1" y2="1">
