<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1200" role="img" aria-label="خاتم فاخر">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fffdfc"/>
      <stop offset="0.45" stop-color="#f8e7e3"/>
      <stop offset="1" stop-color="#ead2de"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="36%" r="42%">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.96"/>
      <stop offset="0.42" stop-color="#f7e0e3" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#f2c8d1" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fae7bb"/>
      <stop offset="0.48" stop-color="#d9b56f"/>
      <stop offset="1" stop-color="#a67842"/>
    </linearGradient>
    <linearGradient id="rose" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f9dce4"/>
      <stop offset="1" stop-color="#d884a0"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="24" stdDeviation="24" flood-color="#8d5f69" flood-opacity="0.22"/>
    </filter>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>

  <rect width="1200" height="1200" fill="url(#bg)"/>
  <circle cx="600" cy="360" r="345" fill="url(#glow)"/>
  <ellipse cx="600" cy="860" rx="260" ry="74" fill="#8f6570" opacity="0.11" filter="url(#soft)"/>
  <ellipse cx="600" cy="575" rx="360" ry="240" fill="#c98c99" opacity="0.07" filter="url(#soft)"/>

  <g filter="url(#shadow)">
    <g transform="translate(600 670) rotate(-16 0 0)">
      <ellipse cx="0" cy="0" rx="188" ry="132" fill="none" stroke="url(#gold)" stroke-width="28"/>
      <ellipse cx="0" cy="0" rx="148" ry="98" fill="none" stroke="#f9f0ea" stroke-width="8" opacity="0.82"/>
      <ellipse cx="0" cy="10" rx="56" ry="34" fill="url(#rose)"/>
      <ellipse cx="0" cy="10" rx="28" ry="16" fill="#fff7f4"/>
      <circle cx="0" cy="-156" r="54" fill="url(#rose)"/>
      <circle cx="0" cy="-156" r="24" fill="#fff7f4"/>
      <path d="M0 -210 C 42 -210, 74 -178, 74 -138" fill="none" stroke="#fff" stroke-width="8" stroke-linecap="round" opacity="0.8"/>
    </g>
  </g>

  <g opacity="0.95">
    <circle cx="260" cy="355" r="18" fill="#fff"/>
    <circle cx="930" cy="420" r="14" fill="#fff"/>
    <circle cx="900" cy="205" r="10" fill="#fff"/>
    <path d="M150 560 l22 10 -22 10 -10 22 -10 -22 -22 -10 22 -10 10 -22z" fill="#fff4d6" opacity="0.8"/>
    <path d="M1010 575 l16 8 -16 8 -8 16 -8 -16 -16 -8 16 -8 8 -16z" fill="#fff4d6" opacity="0.8"/>
  </g>
</svg>
