<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1200" role="img" aria-label="سوار فاخر">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fffdfc"/>
      <stop offset="0.45" stop-color="#f7e5e0"/>
      <stop offset="1" stop-color="#ebd1dc"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="36%" r="42%">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.96"/>
      <stop offset="0.42" stop-color="#f7e1e1" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#f3cad2" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fae7bb"/>
      <stop offset="0.48" stop-color="#d9b56f"/>
      <stop offset="1" stop-color="#a67842"/>
    </linearGradient>
    <linearGradient id="rose" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f9dce4"/>
      <stop offset="1" stop-color="#d884a0"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="24" stdDeviation="24" flood-color="#8d5f69" flood-opacity="0.22"/>
    </filter>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>

  <rect width="1200" height="1200" fill="url(#bg)"/>
  <circle cx="600" cy="360" r="345" fill="url(#glow)"/>
  <ellipse cx="600" cy="860" rx="260" ry="74" fill="#8f6570" opacity="0.11" filter="url(#soft)"/>
  <ellipse cx="600" cy="575" rx="360" ry="240" fill="#c98c99" opacity="0.07" filter="url(#soft)"/>

  <g filter="url(#shadow)">
    <g transform="translate(600 610)">
      <ellipse cx="0" cy="0" rx="260" ry="260" fill="none" stroke="url(#gold)" stroke-width="24"/>
      <ellipse cx="0" cy="0" rx="228" ry="228" fill="none" stroke="#f9f0ea" stroke-width="8" opacity="0.82"/>
      <circle cx="0" cy="-260" r="26" fill="url(#rose)"/>
      <circle cx="225" cy="-115" r="16" fill="#fff7f4"/>
      <circle cx="260" cy="0" r="18" fill="url(#rose)"/>
      <circle cx="225" cy="115" r="16" fill="#fff7f4"/>
      <circle cx="0" cy="260" r="26" fill="url(#rose)"/>
      <circle cx="-225" cy="115" r="16" fill="#fff7f4"/>
      <circle cx="-260" cy="0" r="18" fill="url(#rose)"/>
      <circle cx="-225" cy="-115" r="16" fill="#fff7f4"/>
      <circle cx="0" cy="-20" r="42" fill="#fff7f4"/>
      <circle cx="0" cy="-20" r="22" fill="url(#rose)"/>
      <path d="M0 44 C 36 44, 66 72, 66 108 C 66 152, 34 186, 0 220 C -34 186, -66 152, -66 108 C -66 72, -36 44, 0 44Z" fill="url(#rose)"/>
    </g>
  </g>

  <g opacity="0.95">
    <circle cx="260" cy="355" r="18" fill="#fff"/>
    <circle cx="930" cy="420" r="14" fill="#fff"/>
    <circle cx="900" cy="205" r="10" fill="#fff"/>
    <path d="M150 560 l22 10 -22 10 -10 22 -10 -22 -22 -10 22 -10 10 -22z" fill="#fff4d6" opacity="0.8"/>
    <path d="M1010 575 l16 8 -16 8 -8 16 -8 -16 -16 -8 16 -8 8 -16z" fill="#fff4d6" opacity="0.8"/>
  </g>
