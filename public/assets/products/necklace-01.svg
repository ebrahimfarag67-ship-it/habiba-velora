      <path d="M0 -82 C 48 -82, 88 -42, 88 6 C 88 85, 41 128, 0 170 C -41 128, -88 85, -88 6 C -88 -42, -48 -82, 0 -82Z" fill="#fff7f5" opacity="0.96"/>
      <path d="M0 -55 C 34 -55, 62 -27, 62 5 C 62 57, 28 86, 0 114 C -28 86, -62 57, -62 5 C -62 -27, -34 -55, 0 -55Z" fill="url(#rose)"/>
