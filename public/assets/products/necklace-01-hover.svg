      <circle cx="468" cy="304" r="7" fill="#fff7f4"/>
      <circle cx="540" cy="284" r="7" fill="#fff7f4"/>
      <circle cx="600" cy="276" r="7" fill="#fff7f4"/>
      <circle cx="660" cy="284" r="7" fill="#fff7f4"/>
      <circle cx="732" cy="304" r="7" fill="#fff7f4"/>
      <circle cx="798" cy="340" r="7" fill="#fff7f4"/>
