    <path d="M394 448 C 470 332, 730 332, 806 448" fill="none" stroke="#f5d9cf" stroke-width="8" stroke-linecap="round" opacity="0.8"/>

    <circle cx="370" cy="420" r="12" fill="url(#rose)"/>
