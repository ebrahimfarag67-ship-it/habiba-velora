<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1200" role="img" aria-label="طقم أقراط فاخر - زاوية ثانية">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fffdfc"/>
      <stop offset="0.45" stop-color="#f8e7e4"/>
      <stop offset="1" stop-color="#efced6"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="34%" r="42%">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.98"/>
      <stop offset="0.4" stop-color="#f6dfe0" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#f2c9cf" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f9e4b3"/>
      <stop offset="0.45" stop-color="#d9b56f"/>
      <stop offset="1" stop-color="#a67842"/>
    </linearGradient>
    <linearGradient id="rose" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f9dbe3"/>
      <stop offset="1" stop-color="#d884a0"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="28" stdDeviation="24" flood-color="#8d5f69" flood-opacity="0.2"/>
    </filter>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>

  <rect width="1200" height="1200" fill="url(#bg)"/>
  <circle cx="600" cy="350" r="345" fill="url(#glow)"/>
  <ellipse cx="600" cy="860" rx="250" ry="72" fill="#8f6570" opacity="0.12" filter="url(#soft)"/>
  <ellipse cx="560" cy="585" rx="330" ry="250" fill="#c98c99" opacity="0.08" filter="url(#soft)"/>

  <g filter="url(#shadow)">
    <g transform="translate(430 258) rotate(-7 0 0)">
      <circle cx="0" cy="0" r="34" fill="url(#rose)"/>
      <circle cx="0" cy="0" r="14" fill="#fff7f4"/>
      <rect x="-4" y="28" width="8" height="178" rx="4" fill="url(#gold)"/>
      <ellipse cx="-4" cy="216" rx="60" ry="76" fill="url(#rose)"/>
      <ellipse cx="-4" cy="216" rx="29" ry="39" fill="#fff8f6"/>
      <circle cx="-6" cy="322" r="16" fill="#ffd9e1"/>
      <circle cx="-6" cy="322" r="7.5" fill="#ffffff"/>
    </g>
    <g transform="translate(770 258) rotate(7 0 0)">
      <circle cx="0" cy="0" r="34" fill="url(#rose)"/>
      <circle cx="0" cy="0" r="14" fill="#fff7f4"/>
      <rect x="-4" y="28" width="8" height="178" rx="4" fill="url(#gold)"/>
      <ellipse cx="4" cy="216" rx="60" ry="76" fill="url(#rose)"/>
      <ellipse cx="4" cy="216" rx="29" ry="39" fill="#fff8f6"/>
      <circle cx="6" cy="322" r="16" fill="#ffd9e1"/>
      <circle cx="6" cy="322" r="7.5" fill="#ffffff"/>
    </g>
  </g>

  <g opacity="0.95">
    <circle cx="260" cy="350" r="18" fill="#fff"/>
    <circle cx="920" cy="405" r="14" fill="#fff"/>
    <circle cx="890" cy="205" r="10" fill="#fff"/>
    <circle cx="350" cy="230" r="8" fill="#fff"/>
    <path d="M180 520 l22 10 -22 10 -10 22 -10 -22 -22 -10 22 -10 10 -22z" fill="#fff4d6" opacity="0.75"/>
    <path d="M1000 560 l16 8 -16 8 -8 16 -8 -16 -16 -8 16 -8 8 -16z" fill="#fff4d6" opacity="0.75"/>
  </g>
</svg>
